services:
  postgres:
    image: postgres:16.3-bullseye
    container_name: devicecare-postgres
    environment:
      POSTGRES_DB: devicecare
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d devicecare"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the SQL migrations once, then exits.
  # Neither Quarkus nor Express manage the schema themselves: Flyway is
  # the single source of truth, shared by both backends.
  flyway:
    image: flyway/flyway:11-alpine
    container_name: devicecare-flyway
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=${POSTGRES_URL}
      -user=${POSTGRES_USER}
      -password=${POSTGRES_PASSWORD}
      -connectRetries=10
      migrate
    volumes:
      - ./db/migrations:/flyway/sql

  quarkus-api:
    build: ./devicecare_api_quarkus
    container_name: devicecare-quarkus
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: ${POSTGRES_URL}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Hibernate only validates the existing schema, it doesn't generate it
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: validate
    ports:
      - "8081:8080"

  express-api:
    build: ./express-api
    container_name: devicecare-express
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${POSTGRES_URL}
    ports:
      - "8082:3000"

volumes:
  pgdata: