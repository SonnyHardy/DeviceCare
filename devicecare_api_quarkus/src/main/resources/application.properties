quarkus.analytics.disabled=false

quarkus.application.name=devicecare-quarkus-api

# Database overridden by env vars (QUARKUS_DATASOURCE_*) when running via docker-compose.
# These defaults are only used for local "mvn quarkus:dev" runs.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=username
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/devicecare

# Flyway owns the schema (see db/migrations at the repo root) - Hibernate only validates it
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=true

# OpenAPI — served as plain JSON so ng-openapi can consume it directly
quarkus.smallrye-openapi.path=/openapi.json
quarkus.smallrye-openapi.info-title=DeviceCare API (Quarkus)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Equipment and maintenance ticket tracking API

# CORS, so the Angular dev server (localhost:4200) can call this API directly
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
